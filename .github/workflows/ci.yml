name: CI — Backend lint + tests

on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/ci.yml]
  pull_request:
    branches: [main]
    paths: [backend/**, .github/workflows/ci.yml]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Credentials for the test database (compose-less: GitHub-hosted service containers).
  POSTGRES_DB: disaster
  POSTGRES_USER: disaster
  POSTGRES_PASSWORD: ci-test-password
  # App settings that point to the service containers below.
  REDIS_PASSWORD: ci-test-redis
  RABBITMQ_USER: disaster
  RABBITMQ_PASSWORD: ci-test-rabbit
  RABBITMQ_VHOST: disaster
  MINIO_ROOT_USER: disaster-minio
  MINIO_ROOT_PASSWORD: ci-test-minio
  MINIO_ENDPOINT: "localhost:9000"
  ENVIRONMENT: test
  REQUIRE_INTEGRATION: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.6.9
      - run: ruff check backend/
      - run: ruff format --check backend/

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disaster -d disaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
          RABBITMQ_DEFAULT_VHOST: ${{ env.RABBITMQ_VHOST }}
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pgvector extension: install from PGDG inside the running service container.
      - name: Install pgvector in Postgres container
        run: |
          container=$(docker ps -q --filter "ancestor=postgis/postgis:16-3.5")
          docker exec "$container" bash -c \
            "apt-get update && apt-get install -y --no-install-recommends postgresql-16-pgvector && rm -rf /var/lib/apt/lists/*"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing -v
