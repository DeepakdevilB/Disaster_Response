# Alembic configuration. The database URL is NOT stored here: env.py reads it from the
# application settings (environment variables / .env), so no credentials live in git.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Date-prefixed revision files keep migrations sorted chronologically in the file tree.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
version_path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

# Logging is configured by app.core.logging in env.py (JSON, like the rest of the service).
